version: '3.8'

services:
  drachtio:
    image: drachtio:arm64
    container_name: drachtio-server
    restart: unless-stopped
    ports:
      - "9022:9022"
      - "5060:5060/udp"
    environment:
      - DRACHTIO_SECRET=cymru
    volumes:
      - ./drachtio.conf.xml:/etc/drachtio.conf.xml:ro
    command: drachtio --config-file /etc/drachtio.conf.xml

  freeswitch:
    image: drachtio/drachtio-freeswitch-mrf:latest
    container_name: freeswitch-media
    platform: linux/arm64
    restart: unless-stopped
    ports:
      - "8021:8021"
    environment:
      - MOD_EVENT_SOCKET_PASSWORD=JambonzR0ck$

  callme:
    image: callme:latest
    container_name: callme-voice-bot
    restart: unless-stopped
    depends_on:
      - drachtio
      - freeswitch
    ports:
      - "3101:3101"
      - "3001:3001"
    environment:
      - PORT=3101
      - AUDIO_WS_PORT=3001
      - OCPLATFORM_GATEWAY_URL=http://100.64.0.7:20129
      - DRACHTIO_HOST=drachtio
      - DRACHTIO_PORT=9022
      - DRACHTIO_SECRET=cymru
      - FREESWITCH_HOST=freeswitch
      - FREESWITCH_PORT=8021
      - FREESWITCH_SECRET=JambonzR0ck$
      - SIP_EXTENSION=12611
      - SIP_AUTH_ID=lukybot12611
      - SIP_PASSWORD=08uehljUD3
      - SIP_DOMAIN=1664.3cx.cloud
      - SIP_REGISTRAR=100.64.0.7
      - SIP_REGISTRAR_PORT=5070
      - SIP_LOCAL_ADDRESS=129.159.153.133
      - DRACHTIO_SIP_PORT=5060
    command: node src/index.js
