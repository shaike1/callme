<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CallMe Bot</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: #0a0a0a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    color: #ededed;
    padding: 20px;
  }
  .wrap { width: 100%; max-width: 340px; }

  .brand {
    text-align: center;
    margin-bottom: 32px;
  }
  .brand h1 {
    font-size: 20px;
    font-weight: 600;
    color: #ededed;
    letter-spacing: -0.3px;
  }
  .brand p {
    font-size: 13px;
    color: #666;
    margin-top: 3px;
  }

  .card {
    background: #111;
    border: 1px solid #222;
    border-radius: 12px;
    padding: 24px;
  }
  .field { margin-bottom: 12px; }
  .field label {
    display: block;
    font-size: 12px;
    color: #888;
    margin-bottom: 5px;
    font-weight: 500;
  }
  .field input {
    width: 100%;
    background: #0a0a0a;
    border: 1px solid #2a2a2a;
    border-radius: 8px;
    padding: 10px 12px;
    color: #ededed;
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s;
  }
  .field input:focus { border-color: #555; }
  .btn-login {
    width: 100%;
    background: #ededed;
    color: #0a0a0a;
    border: none;
    border-radius: 8px;
    padding: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
    transition: background 0.15s;
  }
  .btn-login:hover { background: #d4d4d4; }
  .btn-login:disabled { background: #333; color: #666; cursor: not-allowed; }
  .error {
    background: #1a0a0a;
    border: 1px solid #3a1a1a;
    border-radius: 8px;
    color: #f87171;
    font-size: 12px;
    padding: 8px 12px;
    margin-top: 10px;
    text-align: center;
    display: none;
  }
  .error.show { display: block; }
  .footer {
    text-align: center;
    margin-top: 20px;
    font-size: 12px;
  }
  .footer a {
    color: #444;
    text-decoration: none;
    transition: color 0.15s;
  }
  .footer a:hover { color: #888; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <h1>CallMe Bot</h1>
    <p>AI Voice Assistant</p>
  </div>

  <div class="card">
    <form id="login-form" onsubmit="doLogin(event)">
      <div class="field">
        <label>שם משתמש</label>
        <input id="username" type="text" autocomplete="username" autofocus required>
      </div>
      <div class="field">
        <label>סיסמה</label>
        <input id="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn-login" type="submit" id="login-btn">כניסה</button>
      <div class="error" id="error-msg"></div>
    </form>
  </div>

  <div class="footer">
    <a href="/admin/login">ניהול טננטים</a>
  </div>
</div>
<script>
if (sessionStorage.getItem('callme_auth')) { window.location.replace('/'); }

async function doLogin(e) {
  e.preventDefault();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('error-msg');
  err.classList.remove('show');
  btn.disabled = true; btn.textContent = '...';
  try {
    const resp = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await resp.json();
    if (resp.ok && data.token) {
      sessionStorage.setItem('callme_auth', data.token);
      window.location.replace('/');
    } else {
      err.textContent = data.error || 'שגיאת כניסה';
      err.classList.add('show');
      btn.disabled = false; btn.textContent = 'כניסה';
    }
  } catch (ex) {
    err.textContent = 'שגיאת רשת';
    err.classList.add('show');
    btn.disabled = false; btn.textContent = 'כניסה';
  }
}
</script>
</body>
</html>
