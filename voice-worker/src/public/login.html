<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CallMe Bot</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: #1a1a1c;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'SF Mono', 'Fira Code', 'Fira Mono', 'Roboto Mono', monospace;
    color: #abb2bf;
    padding: 20px;
    font-size: 14px;
  }
  .wrap { width: 100%; max-width: 380px; }

  .header { margin-bottom: 28px; }
  .header .prompt { color: #4ade80; }
  .header h1 {
    font-size: 16px;
    font-weight: 400;
    color: #e2e8f0;
    margin-top: 10px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  }
  .header p {
    font-size: 12px;
    color: #4b5563;
    margin-top: 3px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  }

  .form-block { margin-bottom: 20px; }
  .field { margin-bottom: 14px; }
  .field .lbl {
    display: flex;
    justify-content: space-between;
    margin-bottom: 5px;
    font-size: 12px;
  }
  .field .lbl-he { color: #4ade80; }
  .field .lbl-en { color: #374151; font-size: 11px; }
  .field input {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid #2d2d30;
    padding: 7px 0;
    color: #e2e8f0;
    font-size: 14px;
    font-family: 'SF Mono', 'Fira Code', monospace;
    outline: none;
    transition: border-color 0.15s;
  }
  .field input:focus { border-bottom-color: #6366f1; }

  .btn-row { display: flex; gap: 10px; margin-top: 6px; }
  .btn {
    flex: 1;
    background: transparent;
    border: 1px solid #2d2d30;
    border-radius: 4px;
    padding: 9px 10px;
    color: #abb2bf;
    font-size: 12px;
    font-family: 'SF Mono', 'Fira Code', monospace;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
    line-height: 1.3;
    text-align: center;
  }
  .btn:hover { border-color: #6366f1; color: #e2e8f0; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn .he { display: block; }
  .btn .en { display: block; color: #4b5563; font-size: 10px; margin-top: 2px; }

  .error {
    color: #f87171;
    font-size: 12px;
    margin-top: 12px;
    display: none;
  }
  .error.show { display: block; }
  .error::before { content: '✗ '; }
  .remember-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    font-size: 12px;
    color: #4b5563;
  }
  .remember-row input[type=checkbox] {
    width: 14px; height: 14px;
    accent-color: #6366f1;
    cursor: pointer;
  }
  .remember-row label { cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="prompt">callme:~#</div>
    <h1>CallMe Bot</h1>
    <p>AI Voice Assistant</p>
  </div>

  <form id="login-form" class="form-block" onsubmit="return false">
    <div class="field">
      <div class="lbl"><span class="lbl-he">משתמש</span><span class="lbl-en">username</span></div>
      <input id="username" type="text" autocomplete="username" autofocus required>
    </div>
    <div class="field">
      <div class="lbl"><span class="lbl-he">סיסמה</span><span class="lbl-en">password</span></div>
      <input id="password" type="password" autocomplete="current-password" required>
    </div>
    <div class="remember-row">
      <input type="checkbox" id="remember" name="remember">
      <label for="remember">זכור אותי / Remember me</label>
    </div>
    <div class="btn-row">
      <button class="btn" id="btn-dashboard" onclick="doLogin('dashboard')">
        <span class="he">[ דשבורד ]</span>
        <span class="en">Dashboard</span>
      </button>
      <button class="btn" id="btn-admin" onclick="doLogin('admin')">
        <span class="he">[ טננטים ]</span>
        <span class="en">Tenant Mgmt</span>
      </button>
    </div>
    <div class="error" id="error-msg"></div>
  </form>
</div>
<script>
// Check both sessionStorage and localStorage
if (sessionStorage.getItem('callme_auth') || localStorage.getItem('callme_auth')) { window.location.replace('/'); }
if (sessionStorage.getItem('callme_super_auth') || localStorage.getItem('callme_super_auth')) { window.location.replace('/admin'); }

async function doLogin(target) {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  if (!username || !password) return;
  const err = document.getElementById('error-msg');
  const btnD = document.getElementById('btn-dashboard');
  const btnA = document.getElementById('btn-admin');
  err.classList.remove('show');
  btnD.disabled = true; btnA.disabled = true;

  const isAdmin = target === 'admin';
  const endpoint = isAdmin ? '/api/admin/login' : '/api/login';
  const storageKey = isAdmin ? 'callme_super_auth' : 'callme_auth';
  const redirect = isAdmin ? '/admin' : '/';

  try {
    const resp = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await resp.json();
    if (resp.ok && data.token) {
      const remember = document.getElementById('remember').checked;
      if (remember) {
        localStorage.setItem(storageKey, data.token);
      } else {
        sessionStorage.setItem(storageKey, data.token);
      }
      window.location.replace(redirect);
    } else {
      err.textContent = data.error || 'שגיאת כניסה / Login failed';
      err.classList.add('show');
      btnD.disabled = false; btnA.disabled = false;
    }
  } catch (ex) {
    err.textContent = 'שגיאת רשת / Network error';
    err.classList.add('show');
    btnD.disabled = false; btnA.disabled = false;
  }
}
</script>
</body>
</html>
