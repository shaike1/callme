<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CallMe Bot</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: #1a1a1c;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'SF Mono', 'Fira Code', 'Fira Mono', 'Roboto Mono', monospace;
    color: #abb2bf;
    padding: 20px;
    font-size: 14px;
  }
  .wrap { width: 100%; max-width: 360px; }

  .header {
    margin-bottom: 28px;
    color: #6b7280;
    font-size: 13px;
  }
  .header .prompt { color: #4ade80; display: inline; }
  .header h1 {
    font-size: 16px;
    font-weight: 400;
    color: #e2e8f0;
    margin-top: 10px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  }
  .header p { font-size: 12px; color: #4b5563; margin-top: 3px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }

  .form-block { margin-bottom: 20px; }
  .field { margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
  .field .lbl { color: #4ade80; white-space: nowrap; font-size: 13px; min-width: 80px; }
  .field input {
    flex: 1;
    background: transparent;
    border: none;
    border-bottom: 1px solid #2d2d30;
    padding: 6px 0;
    color: #e2e8f0;
    font-size: 14px;
    font-family: 'SF Mono', 'Fira Code', monospace;
    outline: none;
    transition: border-color 0.15s;
  }
  .field input:focus { border-bottom-color: #6366f1; }

  .btn-login {
    background: transparent;
    border: 1px solid #2d2d30;
    border-radius: 4px;
    padding: 8px 20px;
    color: #abb2bf;
    font-size: 13px;
    font-family: 'SF Mono', 'Fira Code', monospace;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
    width: 100%;
  }
  .btn-login:hover { border-color: #6366f1; color: #e2e8f0; }
  .btn-login:disabled { opacity: 0.4; cursor: not-allowed; }

  .error {
    color: #f87171;
    font-size: 12px;
    margin-top: 10px;
    display: none;
  }
  .error.show { display: block; }
  .error::before { content: '✗ '; }

  .footer {
    margin-top: 24px;
    font-size: 12px;
    color: #374151;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  }
  .footer a { color: #374151; text-decoration: none; }
  .footer a:hover { color: #6b7280; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div><span class="prompt">callme</span><span>:~#</span></div>
    <h1>CallMe Bot</h1>
    <p>AI Voice Assistant</p>
  </div>

  <form id="login-form" class="form-block" onsubmit="doLogin(event)">
    <div class="field">
      <span class="lbl">משתמש</span>
      <input id="username" type="text" autocomplete="username" autofocus required>
    </div>
    <div class="field">
      <span class="lbl">סיסמה</span>
      <input id="password" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn-login" type="submit" id="login-btn">[ כניסה ]</button>
    <div class="error" id="error-msg"></div>
  </form>

  <div class="footer">
    <a href="/admin/login">ניהול טננטים →</a>
  </div>
</div>
<script>
if (sessionStorage.getItem('callme_auth')) { window.location.replace('/'); }

async function doLogin(e) {
  e.preventDefault();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('error-msg');
  err.classList.remove('show');
  btn.disabled = true; btn.textContent = '[ ... ]';
  try {
    const resp = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await resp.json();
    if (resp.ok && data.token) {
      sessionStorage.setItem('callme_auth', data.token);
      window.location.replace('/');
    } else {
      err.textContent = data.error || 'שגיאת כניסה';
      err.classList.add('show');
      btn.disabled = false; btn.textContent = '[ כניסה ]';
    }
  } catch (ex) {
    err.textContent = 'שגיאת רשת';
    err.classList.add('show');
    btn.disabled = false; btn.textContent = '[ כניסה ]';
  }
}
</script>
</body>
</html>
