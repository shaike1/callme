<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CallMe Bot — כניסה</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: #070d1f;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: #e2e8f0;
  }
  .card {
    background: #0f1629;
    border: 1px solid #1e2545;
    border-radius: 20px;
    padding: 40px 36px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 24px 80px rgba(0,0,0,0.6);
  }
  .logo {
    text-align: center;
    margin-bottom: 28px;
  }
  .logo-icon {
    font-size: 52px;
    display: block;
    margin-bottom: 8px;
  }
  .logo h1 {
    font-size: 22px;
    font-weight: 700;
    background: linear-gradient(135deg, #818cf8, #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .logo p {
    font-size: 13px;
    color: #64748b;
    margin-top: 4px;
  }
  .field {
    margin-bottom: 16px;
  }
  .field label {
    display: block;
    font-size: 13px;
    color: #94a3b8;
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    background: #070d1f;
    border: 1px solid #1e2545;
    border-radius: 10px;
    padding: 12px 14px;
    color: #e2e8f0;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
  }
  .field input:focus {
    border-color: #818cf8;
  }
  .btn-login {
    width: 100%;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
    transition: opacity 0.2s;
  }
  .btn-login:hover { opacity: 0.9; }
  .btn-login:disabled { opacity: 0.5; cursor: not-allowed; }
  .error {
    background: #2d1f1f;
    border: 1px solid #ef4444;
    border-radius: 10px;
    color: #ef4444;
    font-size: 13px;
    padding: 10px 14px;
    margin-top: 14px;
    text-align: center;
    display: none;
  }
  .error.show { display: block; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <span class="logo-icon">📞</span>
    <h1>CallMe Bot</h1>
    <p>AI Voice Assistant Dashboard</p>
  </div>
  <form id="login-form" onsubmit="doLogin(event)">
    <div class="field">
      <label>שם משתמש</label>
      <input id="username" type="text" placeholder="admin" autocomplete="username" autofocus required>
    </div>
    <div class="field">
      <label>סיסמה</label>
      <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" required>
    </div>
    <button class="btn-login" type="submit" id="login-btn">כניסה</button>
    <div class="error" id="error-msg"></div>
  </form>
</div>
<script>
// If already logged in, go to dashboard
if (sessionStorage.getItem('callme_auth')) {
  window.location.replace('/');
}

async function doLogin(e) {
  e.preventDefault();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('error-msg');
  err.classList.remove('show');
  btn.disabled = true;
  btn.textContent = 'מתחבר...';
  try {
    const resp = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await resp.json();
    if (resp.ok && data.token) {
      sessionStorage.setItem('callme_auth', data.token);
      window.location.replace('/');
    } else {
      err.textContent = data.error || 'שגיאת כניסה';
      err.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'כניסה';
    }
  } catch (ex) {
    err.textContent = 'שגיאת רשת';
    err.classList.add('show');
    btn.disabled = false;
    btn.textContent = 'כניסה';
  }
}
</script>
</body>
</html>
