<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CallMe Tenant Login</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: #1a1a1c;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'SF Mono', 'Fira Code', 'Fira Mono', 'Roboto Mono', monospace;
    color: #abb2bf;
    padding: 20px;
    font-size: 14px;
  }
  .wrap { width: 100%; max-width: 420px; }
  .header { margin-bottom: 28px; }
  .header .prompt { color: #4ade80; }
  .header h1 {
    font-size: 18px;
    font-weight: 500;
    color: #e2e8f0;
    margin-top: 10px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  }
  .header p {
    font-size: 12px;
    color: #4b5563;
    margin-top: 3px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  }
  .tenant-pill {
    display: inline-block;
    margin-top: 8px;
    padding: 5px 10px;
    border: 1px solid #2d2d30;
    border-radius: 999px;
    color: #a5b4fc;
    font-size: 12px;
  }
  .form-block { margin-bottom: 20px; }
  .field { margin-bottom: 14px; }
  .field .lbl {
    display: flex;
    justify-content: space-between;
    margin-bottom: 5px;
    font-size: 12px;
  }
  .field .lbl-he { color: #4ade80; }
  .field .lbl-en { color: #374151; font-size: 11px; }
  .field input {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid #2d2d30;
    padding: 7px 0;
    color: #e2e8f0;
    font-size: 14px;
    font-family: 'SF Mono', 'Fira Code', monospace;
    outline: none;
    transition: border-color 0.15s;
  }
  .field input:focus { border-bottom-color: #6366f1; }
  .remember-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    font-size: 12px;
    color: #4b5563;
  }
  .remember-row input[type=checkbox] {
    width: 14px; height: 14px;
    accent-color: #6366f1;
    cursor: pointer;
  }
  .actions {
    display: flex;
    gap: 10px;
    margin-top: 14px;
  }
  .btn {
    flex: 1;
    background: transparent;
    border: 1px solid #2d2d30;
    border-radius: 4px;
    padding: 10px 12px;
    color: #abb2bf;
    font-size: 12px;
    font-family: 'SF Mono', 'Fira Code', monospace;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
    line-height: 1.3;
    text-align: center;
  }
  .btn:hover { border-color: #6366f1; color: #e2e8f0; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-secondary { text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
  .error {
    color: #f87171;
    font-size: 12px;
    margin-top: 12px;
    display: none;
  }
  .error.show { display: block; }
  .error::before { content: '✗ '; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="prompt">callme:tenant#</div>
    <h1>Tenant Dashboard</h1>
    <p>Sign in to the tenant workspace</p>
    <div class="tenant-pill">__TENANT_NAME__ · __TENANT_ID__</div>
  </div>

  <form class="form-block" onsubmit="return false">
    <div class="field">
      <div class="lbl"><span class="lbl-he">משתמש</span><span class="lbl-en">username</span></div>
      <input id="username" type="text" autocomplete="username" autofocus required>
    </div>
    <div class="field">
      <div class="lbl"><span class="lbl-he">סיסמה</span><span class="lbl-en">password</span></div>
      <input id="password" type="password" autocomplete="current-password" required>
    </div>
    <div class="remember-row">
      <input type="checkbox" id="remember" name="remember">
      <label for="remember">זכור אותי / Remember me</label>
    </div>
    <div class="actions">
      <button class="btn" id="login-btn" onclick="doLogin()">כניסה</button>
      <a class="btn btn-secondary" href="/login">מסך ראשי</a>
    </div>
    <div class="error" id="error-msg"></div>
  </form>
</div>
<script>
const TENANT_ID = '__TENANT_ID__';
const STORAGE_KEY = `callme_tenant_auth:${TENANT_ID}`;
const DASHBOARD_PATH = `/t/${TENANT_ID}/`;
const LOGIN_ENDPOINT = `/t/${TENANT_ID}/api/login`;

if (sessionStorage.getItem(STORAGE_KEY) || localStorage.getItem(STORAGE_KEY)) {
  window.location.replace(DASHBOARD_PATH);
}

async function doLogin() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  if (!username || !password) return;

  const btn = document.getElementById('login-btn');
  const err = document.getElementById('error-msg');
  btn.disabled = true;
  err.classList.remove('show');

  try {
    const resp = await fetch(LOGIN_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    const data = await resp.json();
    if (resp.ok && data.token) {
      const remember = document.getElementById('remember').checked;
      if (remember) {
        localStorage.setItem(STORAGE_KEY, data.token);
      } else {
        sessionStorage.setItem(STORAGE_KEY, data.token);
      }
      window.location.replace(DASHBOARD_PATH);
      return;
    }
    err.textContent = data.error || 'שגיאת כניסה / Login failed';
    err.classList.add('show');
  } catch (_) {
    err.textContent = 'שגיאת רשת / Network error';
    err.classList.add('show');
  } finally {
    btn.disabled = false;
  }
}
</script>
</body>
</html>
